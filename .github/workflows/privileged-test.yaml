name: privileged-test

on:
  workflow_run:
    workflows: ["sc4pac CI"]
    types:
      - completed

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Create check run
        id: create_check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "privileged-test",
              head_sha: context.payload.workflow_run.head_sha,
              status: "in_progress",
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: "Privileged test",
                summary: "Test is running..."
              }
            });
            core.setOutput("check_run_id", response.data.id);

      - name: Run test
        id: test
        run: |
          echo "dummy test failure" && false

      - name: Finish check run
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = "${{ steps.test.outcome }}" === "success" ? "success" : "failure";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number("${{ steps.create_check.outputs.check_run_id }}"),
              status: "completed",
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: "Privileged test",
                summary: `Result: ${conclusion}`,
                text: `View logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              }
            });
