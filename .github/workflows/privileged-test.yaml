name: privileged-test

on:
  workflow_run:
    workflows: ["sc4pac CI"]
    types:
      - completed

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # - name: Create check run
      #   id: create_check
      #   uses: actions/github-script@v7
      #   with:
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     script: |
      #       const response = await github.rest.checks.create({
      #         owner: context.repo.owner,
      #         repo: context.repo.repo,
      #         name: "privileged-test",
      #         head_sha: context.payload.workflow_run.head_sha,
      #         status: "in_progress",
      #         details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
      #         output: {
      #           title: "Privileged test",
      #           summary: "Test is running..."
      #         }
      #       });
      #       core.setOutput("check_run_id", response.data.id);

      - name: Find the check run created by the original workflow
        id: locate
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data } = await github.rest.checks.listForSuite({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_suite_id: context.payload.workflow_run.check_suite_id,
            });

            const match = data.check_runs.find(run =>
              run.name === "privileged-test" &&
              run.head_sha === context.payload.workflow_run.head_sha
            );

            if (!match) {
              core.setFailed("No matching privileged-test check run found in workflow_run.check_suite_id");
              return;
            }

            core.setOutput("check_run_id", String(match.id));
            console.log("Found check run:", match.id);

      - name: Run test
        id: test
        run: |
          echo "dummy test failure" && false

      - name: Finish check run
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const conclusion = "${{ steps.test.outcome }}" === "success" ? "success" : "failure";
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number("${{ steps.locate.outputs.check_run_id }}"),
              status: "completed",
              conclusion,
              completed_at: new Date().toISOString(),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: "Privileged test",
                summary: `Result: ${conclusion}`,
                text: `View logs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              }
            });
