name: privileged-test

on:
  workflow_run:
    workflows: ["sc4pac CI"]
    types:
      - completed

permissions:
  contents: read
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Set pending status on triggering commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}" \
            -d @- <<JSON
          {
            "state": "pending",
            "context": "privileged-test",
            "description": "Waiting for privileged test result",
            "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON

      - name: Run test
        id: test
        run: |
          echo "dummy test failure" && false

      - name: Update final commit status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.test.outcome }}" = "success" ]; then
            STATE="success"
            DESC="privileged test passed"
          elif [ "${{ steps.test.outcome }}" = "failure" ]; then
            STATE="failure"
            DESC="privileged test failed"
          else
            STATE="error"
            DESC="privileged test errored"
          fi

          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.event.workflow_run.head_sha }}" \
            -d @- <<JSON
          {
            "state": "${STATE}",
            "context": "privileged-test",
            "description": "${DESC}",
            "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }
          JSON
