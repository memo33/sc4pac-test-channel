name: sc4pac CI

on:
  push:
    branches: [ "main", "action" ]
  pull_request:
    branches: [ "main" ]

jobs:
  channel:
    uses: memo33/sc4pac-actions/.github/workflows/sc4pac-channel.yaml@v2
    with:
      path: src/yaml
      channel-label: Test
      deploy-repository: memo33/sc4pac-test-channel
      skip-build-website: false
      sc4pac-tools-submodule: sc4pac-tools
      skip-test: false
      skip-url-check: false
      skip-deploy: false
    permissions:
      pages: write
      id-token: write
      checks: write
