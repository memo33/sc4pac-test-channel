name: sc4pac CI

on:
  push:
    branches: [ "main", "action" ]
  pull_request_target:
    branches: [ "main" ]

jobs:
  channel:
    uses: memo33/sc4pac-actions/.github/workflows/sc4pac-channel.yaml@unstable
    with:
      path: src/yaml
      channel-label: Test
      deploy-repository: memo33/sc4pac-test-channel
      sc4pac-tools-submodule: sc4pac-tools
      use-stex-api: true
    secrets:
      stex-api-key: ${{ secrets.STEX_API_KEY }}
      sc4pac-simtropolis-token: ${{ secrets.SC4PAC_SIMTROPOLIS_TOKEN }}
    permissions:
      pages: write
      id-token: write

  prepare:
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Create pending privileged check
        id: priv
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const res = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "privileged-test",
              head_sha: "${{ github.event.pull_request.head.sha || github.sha }}",
              status: "in_progress",
              details_url: "https://example.invalid/queued",
              output: {
                title: "Privileged test",
                summary: "Waiting for privileged test result..."
              }
            });
            core.setOutput("check_run_id", res.data.id);
